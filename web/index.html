<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>حياة أوسع</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="manifest" href="/manifest.webmanifest">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
/* Type. Amiri is a naskh revival and carries the voice; IBM Plex Sans Arabic carries the interface.
   Both ship Arabic and Latin, so the two languages sit on the same rhythm. font-display:swap means
   the app is readable in system type before they land, and never blocks on the network. */
:root{
  --bg:#FAF7F0;--paper:#FFFDF8;--ink:#16262A;--muted:#6B7C7F;
  --teal:#0E4A54;--teal-deep:#0A363D;--gold:#C9A961;--gold-soft:#E8D9B5;
  --sand:#E7DDCB;--line:#E8DFCE;--soft:#F3EEE2;--shade:#EBE4D4;--pen:#1B3A5C;
  --sh-1:0 1px 2px rgba(22,38,42,.04),0 2px 10px rgba(22,38,42,.045);
  --sh-2:0 2px 4px rgba(22,38,42,.05),0 10px 28px rgba(22,38,42,.07);
  --ease:cubic-bezier(.22,.61,.36,1);
  --serif:"Amiri",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;height:100%;
  background:var(--bg);
  /* A page, lit slightly from above, rather than a flat fill. */
  background-image:radial-gradient(120% 60% at 50% 0%,#FFFCF5 0%,rgba(255,252,245,0) 60%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* ---- motion. One gesture, used everywhere: things arrive by rising a little and fading in.
   Short and staggered, so a screen settles rather than performs. Anyone who has asked their
   system for less motion gets none of it. ---- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.top{animation:fade .3s var(--ease) both}
.body>*{animation:rise .34s var(--ease) both}
.body>*:nth-child(1){animation-delay:.02s}
.body>*:nth-child(2){animation-delay:.05s}
.body>*:nth-child(3){animation-delay:.08s}
.body>*:nth-child(4){animation-delay:.11s}
.body>*:nth-child(5){animation-delay:.14s}
.body>*:nth-child(n+6){animation-delay:.16s}
.nav{animation:fade .4s var(--ease) both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---- chrome ---- */
.top{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 12px;
  background:linear-gradient(to bottom,rgba(255,253,248,.9),rgba(255,253,248,0))}
.top .t{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--teal);letter-spacing:.01em}
.top .w{font-size:12px;color:var(--muted);letter-spacing:.04em}
.body{flex:1;padding:18px 22px 24px;display:flex;flex-direction:column;gap:14px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);
  padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 12px);position:sticky;bottom:0;
  background:rgba(250,247,240,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav button{font:inherit;font-size:11px;letter-spacing:.03em;background:none;border:0;color:var(--muted);
  padding:7px 0;cursor:pointer;position:relative;transition:color .2s var(--ease)}
.nav button.on{color:var(--teal);font-weight:600}
/* A hairline of gold under the tab you are on, drawn rather than blinked into place. */
.nav button::after{content:"";position:absolute;left:50%;bottom:0;height:2px;width:0;border-radius:2px;
  background:var(--gold);transform:translateX(-50%);transition:width .28s var(--ease)}
.nav button.on::after{width:20px}

/* ---- controls ---- */
.btn{font:inherit;font-weight:600;border:1px solid var(--sand);color:var(--teal);background:var(--paper);
  border-radius:14px;padding:14px;text-align:center;width:100%;cursor:pointer;box-shadow:var(--sh-1);
  transition:transform .16s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.btn:hover{border-color:var(--gold-soft);box-shadow:var(--sh-2)}
.btn:active{transform:scale(.985);box-shadow:var(--sh-1)}
.btn.fill{background:linear-gradient(180deg,var(--teal) 0%,var(--teal-deep) 100%);color:#FFFDF8;border-color:transparent;
  box-shadow:0 2px 6px rgba(14,74,84,.18),0 10px 26px rgba(14,74,84,.16)}
.btn.fill:hover{box-shadow:0 3px 8px rgba(14,74,84,.22),0 14px 32px rgba(14,74,84,.2)}
.btn.q{border-color:var(--line);color:var(--ink);font-weight:500;text-align:right;box-shadow:none}
.btn.q:hover{border-color:var(--gold-soft);background:var(--soft)}
.btn[disabled]{opacity:.45;box-shadow:none;transform:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  background:var(--paper);cursor:pointer;color:var(--ink);
  transition:border-color .2s var(--ease),background .2s var(--ease),color .2s var(--ease),transform .16s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--teal);color:var(--teal);font-weight:600;background:var(--soft);
  box-shadow:inset 0 0 0 1px rgba(14,74,84,.12)}

.input{font:inherit;border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;
  background:var(--paper);color:var(--ink);box-shadow:inset 0 1px 2px rgba(22,38,42,.03);
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,74,84,.09)}
select.input{appearance:none}
textarea.input{resize:none;height:46px}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--sand);border-radius:12px;
  overflow:hidden;box-shadow:var(--sh-1)}
.seg button{font:inherit;font-weight:600;padding:12px;border:0;background:var(--paper);color:var(--teal);
  cursor:pointer;transition:background .22s var(--ease),color .22s var(--ease)}
.seg button.on{background:linear-gradient(180deg,var(--teal) 0%,var(--teal-deep) 100%);color:#FFFDF8}

/* ---- voice ---- */
.brand{font-family:var(--serif);font-size:40px;font-weight:700;color:var(--teal);text-align:center;
  margin-top:36px;letter-spacing:.01em;line-height:1.25}
.act{font-family:var(--serif);font-size:25px;font-weight:700;color:var(--teal);line-height:1.5;letter-spacing:.005em}
.obs{font-size:17.5px;line-height:1.75}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.lab{font-size:11.5px;font-weight:600;color:var(--gold);letter-spacing:.09em;text-transform:uppercase}
.k{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.09em;text-transform:uppercase}
.dose{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;
  padding:3px 11px;color:var(--muted);background:var(--paper)}
.count{font-family:var(--serif);font-size:27px;color:var(--teal);font-weight:700;text-align:center;letter-spacing:.01em}
.err{color:#8A3B2E;font-size:13px;background:rgba(138,59,46,.06);border:1px solid rgba(138,59,46,.14);
  border-radius:10px;padding:10px 12px}
.res{font-size:12px;color:var(--teal);text-align:center;text-decoration:underline;
  text-underline-offset:3px;margin-top:10px;opacity:.85}
details summary{cursor:pointer}
details[open] summary{margin-bottom:8px}

/* ---- the week strip and the notebook grid ---- */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.strip div{border:1px solid var(--line);border-radius:9px;padding:7px 2px;text-align:center;font-size:10px;
  color:var(--muted);min-height:54px;background:var(--paper);box-shadow:var(--sh-1);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.strip .n{font-weight:600;color:var(--teal);display:block;margin-bottom:4px;font-size:11px}
.strip .o{background:linear-gradient(160deg,var(--shade),var(--sand));border-color:var(--sand)}
.strip .m{color:var(--pen);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid div{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:12px;color:var(--pen);background:var(--paper)}
.grid .o{background:linear-gradient(160deg,var(--shade),var(--sand));border-color:var(--sand)}

/* The open day: nothing is asked, so the screen holds a quiet panel instead of content. */
.shade{flex:1;min-height:320px;border-radius:22px;border:1px solid var(--line);box-shadow:var(--sh-1);
  background:linear-gradient(165deg,var(--soft) 0%,var(--shade) 55%,var(--sand) 100%)}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.row span:last-child{color:var(--muted)}

/* Arabic is a connected script: tracking pulls the joins apart and the word stops reading as a word.
   Latin keeps the tracking, Arabic gets none. setLang() sets html[lang], so this follows the reader. */
html[lang="ar"] .lab,html[lang="ar"] .k,html[lang="ar"] .top .t,html[lang="ar"] .top .w,
html[lang="ar"] .brand,html[lang="ar"] .act,html[lang="ar"] .count,html[lang="ar"] .nav button,
html[lang="ar"] .obs,html[lang="ar"] .dose{letter-spacing:0}

/* Loading. The shimmer is the one place motion is allowed to loop. */
.skel{height:17px;border-radius:8px;background:linear-gradient(90deg,var(--soft),var(--shade),var(--soft));
  background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* ---- splash. The mark draws itself once, the way it is built: the core lands, the line leaves it at
   the top, turns clockwise a turn and a quarter, and stops open. It never loops: a mark that keeps
   turning is a loading spinner, which the identity forbids. The native launch screen is plain paper
   of this same colour, so the hand-off from the shell to this page cannot be seen. Everything here
   rests in its finished state, so with reduced motion the lockup simply stands, then goes. ---- */
#splash{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:0 24px 6vh;text-align:center;
  transition:opacity .32s var(--ease) .16s}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;transition:opacity .22s var(--ease)}
/* Leaving is two beats, so the lockup and the first screen are never on the glass together:
   the lockup lifts off the paper first, then the paper itself gives way to the page beneath. */
#splash.out{opacity:0;pointer-events:none}
#splash.out .sp-in{opacity:0}
#splash svg{width:104px;height:auto;display:block;overflow:visible}
#splash .sp-arc{fill:none;stroke:var(--teal);stroke-width:6.5;stroke-linecap:round;
  stroke-dasharray:216 432;animation:sp-draw 1.15s cubic-bezier(.45,.05,.2,1) .18s both}
#splash .sp-core{fill:var(--teal);transform-box:fill-box;transform-origin:center;
  animation:sp-core .32s var(--ease) both}
#splash .sp-name{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.3;color:var(--teal);
  margin-top:26px;animation:rise .5s var(--ease) 1s both}
#splash .sp-tag{font-size:14.5px;color:var(--muted);margin-top:4px;animation:fade .5s var(--ease) 1.3s both}
/* 214.4 is the length of the line; the dash starts a hair past it so no round cap shows before the draw. */
@keyframes sp-draw{from{stroke-dashoffset:220}to{stroke-dashoffset:0}}
@keyframes sp-core{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
</style>

// Plays once per session: every cold start of the app, and the first open of a tab on the web (a reload
// does not replay it). It leaves once the words have stood for HOLD and the first real screen is up,
// whichever comes later, never holds anyone past SPLASH_MAX, and a tap skips it.
(() => {
  const el = document.getElementById("splash");
  if (!el) return;
  let seen = false;
  try { seen = sessionStorage.getItem("awl.splash") === "1"; sessionStorage.setItem("awl.splash", "1"); } catch {}
  if (seen) { el.remove(); return; }
  let lang = "ar"; try { lang = localStorage.getItem("awl.lang") || "ar"; } catch {}
  if (lang === "en") {
    el.lang = "en"; el.dir = "ltr";
    el.querySelector(".sp-name").textContent = "A Wider Life";
    el.querySelector(".sp-tag").textContent = "You do not grow, the space does.";

  // The name and the line are fully in at 1.8 s; they stay two seconds before the first screen takes over.

  let gone = false, watch = null;
  const leave = () => {
    if (gone) return; gone = true;
    if (watch) watch.disconnect();
    el.classList.add("out");
    setTimeout(() => el.remove(), still ? 0 : 520);

  const check = () => { if (shell.childElementCount && !shell.querySelector(".skel") && performance.now() - t0 >= SPLASH_MIN) leave(); };

let FLAGS = null;
const S = { email: localStorage.getItem("awl.email") || "", token: localStorage.getItem("awl.token"), lang: localStorage.getItem("awl.lang") || "ar", screen: "door", data: null, err: null };
T.ar.authErr = { bad_credentials: "البريد أو كلمة السر غلط.", email_taken: "البريد ده معمول بيه حساب. ادخل بيه.", bad_email: "البريد مش مظبوط.", password_too_short: "كلمة السر لازم ٨ حروف على الأقل.", password_too_long: "كلمة السر طويلة أوي.", too_many_attempts: "محاولات كتير. استنى ربع ساعة." };
T.en.authErr = { bad_credentials: "That email or password is wrong.", email_taken: "That email already has an account. Sign in instead.", bad_email: "That address does not look right.", password_too_short: "Passwords need at least 8 characters.", password_too_long: "That password is too long.", too_many_attempts: "Too many attempts. Try again in fifteen minutes." };
const t = () => T[S.lang];
const app = document.getElementById("app");
const h = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { "content-type": "application/json", ...(S.token ? { authorization: "Bearer " + S.token } : {}), ...(opts.headers || {}) } });
  const text = await res.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch {}
  if (!res.ok) { const e = new Error((data && data.code) || res.status); e.status = res.status; e.data = data; throw e; }
  return data;
}

const setEmail = (e) => { S.email = e; try { localStorage.setItem("awl.email", e); } catch {} };
function setLang(l) { if (l !== S.lang) FLAGS = null; S.lang = l; localStorage.setItem("awl.lang", l); document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr"; }
setLang(S.lang);

function nav(active) {
  const x = t();
  return `<div class="nav">${[["week", x.week], ["day", x.day], ["notebook", x.notebook], ["settings", x.settings]].map(([k, l]) => `<button class="${active === k ? "on" : ""}" data-go="${k}">${l}</button>`).join("")}</div>`;
}
function topBar(title, sub = "") { return `<div class="top"><div class="t">${h(title)}</div><div class="w">${h(sub)}</div></div>`; }
// A real zone list beats free text: one typo used to be enough to break every date rule in the engine.
const ZONES = (() => {
  try { const all = Intl.supportedValuesOf("timeZone"); if (all && all.length) return all; } catch {}
  return ["Africa/Cairo", "Asia/Riyadh", "Asia/Dubai", "Europe/London", "America/New_York", "UTC"];
})();
function zoneOptions(sel) {
  const list = ZONES.includes(sel) ? ZONES : [sel, ...ZONES];
  return list.map((z) => `<option value="${h(z)}" ${z === sel ? "selected" : ""}>${h(z.replace(/_/g, " "))}</option>`).join("");
}
const fmtDate = (iso) => { try { return new Intl.DateTimeFormat(S.lang === "ar" ? "ar-EG" : "en-GB", { day: "numeric", month: "long" }).format(new Date(iso + "T00:00:00")); } catch { return iso; } };
const errLine = () => S.err ? `<div class="err">${h(S.err)}</div>` : "";
// Something on screen while a request is in flight. Drawn only when the app is otherwise empty, so
// moving between tabs keeps the current screen rather than flashing.
function busy(title) {
  if (app.innerHTML.trim() && !app.dataset.busy) return;
  app.dataset.busy = "1";
  app.innerHTML = topBar(title || "") + `<div class="body"><div class="skel"></div><div class="skel"></div><div class="skel" style="width:60%"></div></div>`;
}
const unbusy = () => { delete app.dataset.busy; };

// ---------- screens ----------
// The door. An account is required, so nothing else renders until there is a session.
async function auth(mode = "login") {
  const x = t();
  unbusy();
  const reg = mode === "register";
  app.innerHTML = `<div class="body"><div class="brand">${S.lang === "ar" ? "حياة أوسع" : "A Wider Life"}</div>
    <div class="hint" style="text-align:center">${reg ? x.regHint : x.loginHint}</div>
    <div class="lab">${x.email}</div>
    <input class="input" id="em" type="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" style="direction:ltr" value="${h(S.email || "")}">
    <div class="lab">${x.password}</div>
    <input class="input" id="pw" type="password" autocomplete="${reg ? "new-password" : "current-password"}" style="direction:ltr">
    ${reg ? `<div class="hint">${x.pwRule}</div>` : ""}
    ${errLine()}
    <button class="btn fill" id="go">${reg ? x.createAccount : x.signIn}</button>
    <button class="btn" id="swap">${reg ? x.haveAccount : x.noAccount}</button>
    <div class="hint" style="text-align:center;margin-top:auto"><button class="chip" id="forgot">${x.forgot}</button></div></div>`;

  const submit = async () => {
    const email = document.getElementById("em").value.trim();
    const password = document.getElementById("pw").value;
    setEmail(email); S.err = null;
    const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = x.working;
    try {
      const r = await api(reg ? "/v1/auth/register" : "/v1/auth/login", { method: "POST", body: JSON.stringify({ email, password, lang: S.lang }) });
      S.token = r.token; localStorage.setItem("awl.token", r.token); if (r.lang) setLang(r.lang);
      history.replaceState(null, "", "/");
      r.state === "entry" ? entry() : go("day");
    } catch (e) {
      S.err = x.authErr[e.message] || String(e.message);
      auth(mode);
    }
  };
  document.getElementById("go").onclick = submit;
  document.getElementById("pw").onkeydown = (ev) => { if (ev.key === "Enter") submit(); };
  document.getElementById("swap").onclick = () => { S.err = null; auth(reg ? "login" : "register"); };
  // Until there is an email provider there is no reset link to send, so the copy's own code is the way back.
  document.getElementById("forgot").onclick = async () => {
    const code = prompt(x.restorePrompt);
    if (!code) return;
    try {
      const r = await api("/v1/session/open", { method: "POST", body: JSON.stringify({ code }) });
      S.token = r.token; localStorage.setItem("awl.token", r.token); setLang(r.lang);
      r.state === "entry" ? entry() : go("day");
    } catch (e) { S.err = e.status === 404 ? x.badCode : String(e.message); auth(mode); }
  };
}
// The only screen left that is not content: the Worker could not be reached to open a session.
function unreachable() {
  const x = t();
  app.innerHTML = `<div class="body"><div class="brand">${S.lang === "ar" ? "حياة أوسع" : "A Wider Life"}</div>
    <div class="hint">${x.offline}</div>
    ${errLine()}<button class="btn fill" id="retry">${x.retry}</button>
    <div class="hint" style="text-align:center;margin-top:auto"><button class="chip" data-lang="${S.lang === "ar" ? "en" : "ar"}">${S.lang === "ar" ? "English" : "عربي"}</button></div></div>`;
  document.getElementById("retry").onclick = () => auth("login");
  bind();
}

async function entry(step = 1, st = { tz: Intl.DateTimeFormat().resolvedOptions().timeZone, open: 5, names: null, witness: "", circle: null }) {
  const x = t();
  const f = await flags();
  const circles = (f.circles || []).length ? f.circles : ["self"];
  if (!st.circle || !circles.includes(st.circle)) st.circle = circles[0];
  unbusy();
  const DAYS = S.lang === "ar" ? ["الأحد", "الاتنين", "التلات", "الأربع", "الخميس", "الجمعة", "السبت"] : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  if (st.open === 5 && S.lang === "en") st.open = 0;
  let inner = "";
  if (step === 1) inner = `<div class="lab">${x.tz}</div><div class="hint">${x.tzHint}</div><select class="input" id="tz">${zoneOptions(st.tz)}</select><div style="margin-top:auto"></div><button class="btn fill" id="n">${x.ok}</button>`;
  if (step === 2) inner = `<div class="lab">${x.openDay}</div><div class="hint">${x.openHint}</div><div class="chips">${DAYS.map((d, i) => `<button class="chip ${i === st.open ? "on" : ""}" data-d="${i}">${d}</button>`).join("")}</div>
    <div class="lab" style="margin-top:10px">${x.who}</div><div class="hint">${x.whoHint}</div><input class="input" id="wit" value="${h(st.witness)}"><div style="margin-top:auto"></div><button class="btn fill" id="n">${x.next}</button>`;
  if (step === 3) inner = `<div class="lab">${x.circle}</div><div class="chips">${circles.map((k) => `<button class="chip ${k === st.circle ? "on" : ""}" data-c="${k}">${x.circles[k]}</button>`).join("")}</div>${circles.length === 1 ? `<div class="hint">${x.oneCircle}</div>` : ""}${errLine()}<div style="margin-top:auto"></div><button class="btn fill" id="n">${x.start}</button>`;
  app.innerHTML = topBar(x.before, `\u200e${step} / 3`) + `<div class="body">${inner}</div>`;
  app.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => { st.open = +b.dataset.d; entry(2, st); });
  app.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => { st.circle = b.dataset.c; entry(3, st); });
  document.getElementById("n").onclick = async () => {
    if (step === 1) { st.tz = document.getElementById("tz").value.trim(); return entry(2, st); }
    if (step === 2) { st.witness = document.getElementById("wit").value.trim(); return entry(3, st); }
    // the reader's week: the first day is the day after the open day; names in that order
    const first = (st.open + 1) % 7; st.names = Array.from({ length: 7 }, (_, i) => DAYS[(first + i) % 7]);
    try { await api("/v1/entry", { method: "POST", body: JSON.stringify({ timezone: st.tz, open_day: st.open, day_names: st.names, witness_name: st.witness, circle: st.circle }) }); go("week"); }
    catch (e) { S.err = e.status === 451 ? (S.lang === "ar" ? "بلدك لسه ما اتفتحش." : "Your country is not open yet.") : String(e.message); entry(3, st); }
  };
}

function stripHtml(strip) { return `<div class="strip">${strip.map((d) => `<div class="${d.kind === "open" ? "o" : ""}"><span class="n">${h(d.name)}</span>${d.kind === "act" ? `<span class="${d.answer ? "m" : ""}">${d.answer === "done" ? t().done : d.answer === "smaller" ? t().smaller : ""}</span>` : d.kind === "open" ? t().openK : t().questionK}</div>`).join("")}</div>`; }
const pulseHtml = (p, x) => `<div class="k">${x.obs}</div><div class="obs">${h(p.observation)}</div>${p.audio.observation ? `<audio controls src="${h(p.audio.observation)}"></audio>` : ""}
  <div class="k">${x.actL}</div><span class="dose">${x.doseL}: ${x.doses[p.dose]}</span><div class="act">${h(p.act)}</div>${p.audio.act ? `<audio controls src="${h(p.audio.act)}"></audio>` : ""}
  <div class="k">${x.sign}</div><div>${h(p.sign)}</div>`;

async function day() {
  const x = t(); busy(x.day); let d;
  try { d = await api("/v1/today"); } catch (e) { if (e.status === 409 && e.message === "entry_incomplete") return entry(); if (e.status === 401) { localStorage.removeItem("awl.token"); S.token = null; return auth("login"); } S.err = String(e.message); }
  unbusy(); if (!d) { app.innerHTML = topBar(x.day) + `<div class="body">${errLine()}</div>` + nav("day"); return bind(); }
  let inner = "";
  if (d.kind === "done") inner = `<div class="brand" style="margin-top:0">${S.lang === "ar" ? "حياة أوسع" : "A Wider Life"}</div><div class="hint" style="text-align:center">${x.doneHint}</div><button class="btn" data-go="notebook">${x.notebook}</button>`;
  else if (d.kind === "open") inner = `<div class="shade"></div>`;

  else if (d.kind === "before") inner = `<div class="hint">${x.beforeStart.replace("{d}", h(d.strip[0]?.name || "")).replace("{on}", h(fmtDate(d.starts_on || "")))}</div>${d.witness ? `<div class="hint">${x.witness.replace("{d}", h(d.witness.open_day)).replace("{w}", h(d.witness.witness))}</div>` : ""}${d.first ? `<div class="act">${h(d.first.title)}</div><div class="k">${x.f4}</div><div>${h(d.first.act_full)} · ${h(d.first.act_half)} · ${h(d.first.act_min)}</div>` : ""}<button class="btn" data-go="week">${x.sheet}</button>`;
  else if (d.kind === "first") inner = `<div class="hint">${x.first}</div>${d.witness ? `<div class="hint">${x.witness.replace("{d}", h(d.witness.open_day)).replace("{w}", h(d.witness.witness))}</div>` : ""}${d.first ? `<div class="act">${h(d.first.title)}</div><div class="k">${x.f4}</div><div>${h(d.first.act_full)} · ${h(d.first.act_half)} · ${h(d.first.act_min)}</div>` : ""}<button class="btn" data-go="week">${x.sheet}</button>${d.next?.pulse ? `<div class="hint" style="margin-top:14px">${x.tomorrow}</div>${pulseHtml(d.next.pulse, x)}` : ""}`;
  else inner = `<div class="hint">${x.says}</div>${d.pulse ? pulseHtml(d.pulse, x) : `<div class="hint">${x.incomplete}</div>`}
    ${d.answerable && d.pulse ? `<div class="hint" style="text-align:center;margin-top:auto">${x.tapAfter}</div><div class="two"><button class="btn fill" data-a="done">${x.done}</button><button class="btn" data-a="smaller">${x.smaller}</button></div>` : ""}

}

async function week() {
  const x = t(); busy(x.sheet);
  const cf = await flags();
  const circles = (cf.circles || []).length ? cf.circles : ["self"];
  let w;
  try { w = await api("/v1/week"); } catch (e) { if (e.status === 409) return entry(); if (e.status === 401) { localStorage.removeItem("awl.token"); S.token = null; return auth("login"); } S.err = String(e.message); }
  unbusy(); if (!w) { app.innerHTML = topBar(x.sheet) + `<div class="body">${errLine()}</div>` + nav("week"); return bind(); }
  const ro = w.locked ? "disabled" : "";
  const f = (k, v, hint) => `<div class="lab">${k}</div>${hint ? `<div class="hint">${hint}</div>` : ""}<input class="input" data-f="${v}" value="${h(w[v] || "")}" ${ro} maxlength="140">`;
  app.innerHTML = topBar(x.sheet, `${x.week} ${w.week_no}`) + `<div class="body">
    ${w.article ? `<div class="act">${h(w.article.title)}</div><details><summary class="hint">${S.lang === "ar" ? "المقال" : "The article"}</summary><div>${h(w.article.body_md)}</div></details>` : ""}
    <div class="lab">${x.f1}</div><div class="chips">${circles.map((k) => `<button class="chip ${k === w.circle ? "on" : ""}" data-circle="${k}" ${ro}>${x.circles[k]}</button>`).join("")}</div>
    <div class="lab">${x.f2}</div><div>${h(w.trait_label || w.trait_id || "")}</div>
    ${f(x.f3, "anchor_text", x.f3h)}
    <div class="lab">${x.f4}</div><div class="hint">${x.f4h}</div>
    ${f(x.full, "act_full")}${f(x.half, "act_half")}${f(x.min, "act_min")}
    ${f(x.f5, "sign_text", x.f5h)}
    ${w.locked ? `<div class="hint">${x.locked}</div>` : `<button class="btn" id="pin">${x.pin}</button><button class="btn fill" id="save">${x.save}</button>`}
    ${errLine()}<div class="hint" style="text-align:center">${x.foot}</div></div>` + nav("week");
  if (!w.locked) {
    document.getElementById("save").onclick = async () => { const body = {}; app.querySelectorAll("[data-f]").forEach((i) => body[i.dataset.f] = i.value); try { await api("/v1/week", { method: "PUT", body: JSON.stringify(body) }); S.err = null; week(); } catch (e) { S.err = String(e.message); week(); } };
    document.getElementById("pin").onclick = async () => { try { await api("/v1/week/pin", { method: "POST" }); week(); } catch (e) { S.err = String(e.message); week(); } };
    app.querySelectorAll("[data-circle]").forEach((b) => b.onclick = async () => { try { await api("/v1/week", { method: "PUT", body: JSON.stringify({ circle: b.dataset.circle }) }); week(); } catch (e) { S.err = String(e.message); week(); } });
  }
  bind();
}

async function notebook() {
  const x = t(); busy(x.notebook); let n;
  try { n = await api("/v1/notebook"); } catch (e) { if (e.status === 401) { localStorage.removeItem("awl.token"); S.token = null; return auth("login"); } if (e.status === 409) return entry(); S.err = String(e.message); }
  unbusy(); if (!n) { app.innerHTML = topBar(x.notebook) + `<div class="body">${errLine()}</div>` + nav("notebook"); return bind(); }
  const grid = n.grid.map((e) => `<div class="${e.answer === "empty" ? "" : ""}">${e.answer === "done" ? "●" : e.answer === "smaller" ? "◐" : e.answer === "question" ? "?" : ""}</div>`).join("");
  app.innerHTML = topBar(x.notebook) + `<div class="body"><div class="count">${x.moved.replace("{p}", n.count.passed).replace("{m}", n.count.moved)}</div><div class="grid">${grid}</div>
    ${n.weeks.map((w) => `<div class="row"><span>${x.week} ${w.week_no} · ${x.circles[w.circle] || w.circle} · ${h(w.trait_label || w.trait_id || "")}</span><span>${w.week_no === n.current_week ? (S.lang === "ar" ? "الأسبوع ده" : "This week") : "›"}</span></div>`).join("")}
    ${n.resources ? `<div class="res">${x.resources}: ${h(n.resources.name)} ${h(n.resources.number)}</div>` : ""}</div>` + nav("notebook");
  bind();
}

async function settings() {
  const x = t(); busy(t().settings);
  let st = null; try { st = (await api("/v1/today")).status; } catch {}
  const f = await flags(); const langs = (f.langs || []).length ? f.langs : [S.lang];
  unbusy();
  app.innerHTML = topBar(x.settings) + `<div class="body">
    ${langs.length > 1 ? `<div class="row"><span>${x.language}</span><button class="chip" data-lang="${S.lang === "ar" ? "en" : "ar"}">${S.lang === "ar" ? "English" : "عربي"}</button></div>` : ""}
    <div class="row"><span>${x.quotes}</span><button class="chip" id="qt">${notifOn() ? x.on : x.off}</button></div>
    <div class="hint">${x.quotesHint}</div>
    <div class="row"><span>${x.account}</span><span style="direction:ltr">${h(S.email || "")}</span></div>
    <button class="btn" id="signout">${x.signOut}</button>
    <div class="lab" style="margin-top:14px">${x.recovery}</div>
    <div class="hint">${x.recoveryHint}</div>
    <div class="row"><span id="rc" style="direction:ltr;letter-spacing:.08em;font-weight:600">••••• ••••• •••••</span><button class="chip" id="rcShow">${x.show}</button></div>
    <button class="btn" id="restore">${x.restore}</button>
    <div class="lab" style="margin-top:14px">${x.rhythm}</div>
    <div class="seg"><button id="resume" class="${st === "active" ? "on" : ""}">${x.active}</button><button id="pause" class="${st === "paused" ? "on" : ""}">${x.paused}</button></div>
    <div class="hint">${x.pauseHint}</div>
    <div style="margin-top:auto"></div>
    <button class="btn" id="so">${x.startOver}</button><button class="btn" id="del">${x.del}</button>${errLine()}</div>` + nav("settings");
  const act = (action) => async () => { if ((action === "start_over" || action === "delete") && !confirm(x.sure)) return; try { await api("/v1/account", { method: "POST", body: JSON.stringify({ action }) }); if (action === "start_over" || action === "delete") { localStorage.removeItem("awl.token"); S.token = null; return auth("login"); } settings(); } catch (e) { S.err = String(e.message); settings(); } };
  const qt = document.getElementById("qt");
  if (!PLUGIN("LocalNotifications")) { qt.disabled = true; qt.textContent = x.nativeOnly; }
  else qt.onclick = async () => { const on = await setQuotes(!notifOn()); qt.textContent = on ? x.on : x.off; if (!on && notifOn()) S.err = x.noPerm; };
  document.getElementById("signout").onclick = async () => {
    try { await api("/v1/auth/logout", { method: "POST" }); } catch {}
    localStorage.removeItem("awl.token"); S.token = null; S.err = null;
    auth("login");
  };
  const rcShow = document.getElementById("rcShow");
  rcShow.onclick = async () => {
    try {
      const r = await api("/v1/account", { method: "POST", body: JSON.stringify({ action: "recovery_code" }) });
      document.getElementById("rc").textContent = r.printed;
      rcShow.textContent = x.copy;
      rcShow.onclick = async () => { try { await navigator.clipboard.writeText(r.code); rcShow.textContent = x.copied; } catch { rcShow.textContent = x.copyFail; } };
    } catch (e) { S.err = String(e.message); settings(); }
  };
  document.getElementById("restore").onclick = async () => {
    const code = prompt(x.restorePrompt);
    if (!code) return;
    try {
      const r = await api("/v1/session/open", { method: "POST", body: JSON.stringify({ code }) });
      S.token = r.token; localStorage.setItem("awl.token", r.token); setLang(r.lang);
      r.state === "entry" ? entry() : go("day");
    } catch (e) { S.err = e.status === 404 ? x.badCode : String(e.message); settings(); }
  };
  document.getElementById("pause").onclick = act("pause"); document.getElementById("resume").onclick = act("resume");
  document.getElementById("so").onclick = act("start_over"); document.getElementById("del").onclick = act("delete");
  bind();
}

function bind() {
  app.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => go(b.dataset.go));
  app.querySelectorAll("[data-lang]").forEach((b) => b.onclick = () => { setLang(b.dataset.lang); if (!S.token) return auth("login"); go(["day", "week", "notebook", "settings"].includes(S.screen) ? S.screen : "day"); });
}
function go(s) { S.err = null; S.screen = s; ({ day, week, notebook, settings })[s](); }
S.token ? go("day") : auth("login");
if (!NATIVE && "serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});


// ---------- Ibn Arabi quotes, as local notifications ----------
// Local, not push: nothing is scheduled by a server, so this works offline and needs no APNs key.
// iOS caps an app at 64 PENDING notifications. 10:00 to 02:00 every three hours is 6 a day, so
// filling to NOTIF_MAX covers about ten days; the queue is refilled on every open anyway.
const NOTIF_START_H = 10, NOTIF_END_H = 2, NOTIF_STEP_MIN = 180, NOTIF_MAX = 60;
// Window length in minutes, wrapping past midnight: 10:00 -> 02:00 is 16 hours.
const NOTIF_WINDOW_MIN = ((NOTIF_END_H - NOTIF_START_H + 24) % 24) * 60;
const notifOn = () => { try { return localStorage.getItem("awl.quotes") === "1"; } catch { return false; } };

/** The next `count` slots, anchored to the window start so the times never drift with when we refill. */
function nextSlots(from, count) {
  const out = [];
  const base = new Date(from); base.setHours(NOTIF_START_H, 0, 0, 0);
  for (let day = 0; out.length < count && day < 400; day++) {
    for (let off = 0; off <= NOTIF_WINDOW_MIN && out.length < count; off += NOTIF_STEP_MIN) {
      const at = new Date(base); at.setDate(at.getDate() + day); at.setMinutes(at.getMinutes() + off);
      if (at > from) out.push(at);
    }
  }
  return out;
}

// What the server can actually serve: circles with articles, languages with content.
async function flags() {
  if (FLAGS) return FLAGS;
  try { FLAGS = await api(`/v1/flags?lang=${S.lang}`); } catch { FLAGS = { circles: [], langs: [] }; }
  return FLAGS;
}

let QUOTES = null;
async function loadQuotes() {
  if (QUOTES) return QUOTES;
  // Bundled in the app and served by the Worker, so it resolves both natively and on the web.
  const r = await fetch(NATIVE ? "quotes.json" : "/quotes.json");
  QUOTES = (await r.json()).quotes;
  return QUOTES;
}

/** Clear whatever is queued and refill from now. Safe to call on every open; it is idempotent. */
async function scheduleQuotes() {
  const ln = PLUGIN("LocalNotifications");
  if (!ln || !notifOn()) return;
  try {
    const pending = await ln.getPending();
    if (pending.notifications.length) await ln.cancel({ notifications: pending.notifications.map((n) => ({ id: n.id })) });
    const qs = await loadQuotes();
    // Walk the quotes in order from a rotating offset, so a refill does not always restart at قول 1.
    let off = 0; try { off = Number(localStorage.getItem("awl.quotesAt") || 0) % qs.length; } catch {}
    const slots = nextSlots(new Date(), NOTIF_MAX);
    await ln.schedule({ notifications: slots.map((at, i) => {
      const q = qs[(off + i) % qs.length];
      return { id: 1000 + i, title: S.lang === "ar" ? "حياة أوسع" : "A Wider Life", body: q.text, schedule: { at }, smallIcon: "ic_stat_icon_config_sample" };
    }) });
    try { localStorage.setItem("awl.quotesAt", String((off + slots.length) % qs.length)); } catch {}
  } catch {}
}

async function setQuotes(on) {
  const ln = PLUGIN("LocalNotifications");
  if (!ln) return false;
  if (!on) {
    try { localStorage.setItem("awl.quotes", "0"); } catch {}
    try { const p = await ln.getPending(); if (p.notifications.length) await ln.cancel({ notifications: p.notifications.map((n) => ({ id: n.id })) }); } catch {}
    return false;
  }
  let perm = await ln.checkPermissions();
  if (perm.display !== "granted") perm = await ln.requestPermissions();
  if (perm.display !== "granted") return false;
  try { localStorage.setItem("awl.quotes", "1"); } catch {}
  await scheduleQuotes();
  return true;
}

const AppPlugin = PLUGIN("App");

// Push registration is built but dormant: it runs only when the Worker's flag says so (decision due 24 Oct).
async function registerPush() {
  const push = PLUGIN("PushNotifications"); if (!push || !S.token) return;
  try {
    const f = await api("/v1/flags"); if (!f.notify) return;
    const perm = await push.requestPermissions(); if (perm.receive !== "granted") return;
    push.addListener("registration", (t) => api("/v1/device", { method: "POST", body: JSON.stringify({ platform: "ios", token: t.value }) }).catch(() => {}));
    await push.register();
  } catch {}
}
registerPush();
scheduleQuotes();
if (AppPlugin) AppPlugin.addListener("appStateChange", ({ isActive }) => { if (isActive) scheduleQuotes(); });
</script>
