<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4ED">
<title>حياة أوسع</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حياة أوسع">
<style>
:root{--bg:#FBF9F4;--paper:#fff;--ink:#1C2B2E;--muted:#5B6E71;--teal:#0E4A54;--gold:#C9A961;--sand:#E7DDCB;--line:#E3DAC7;--soft:#F1ECDF;--pen:#1B3A5C;--shade:#EAE3D3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;height:100%}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 10px}
.top .t{font-weight:600;color:var(--teal)}.top .w{font-size:12px;color:var(--muted)}
.body{flex:1;padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--bg);position:sticky;bottom:0}
.nav button{font:inherit;font-size:11px;background:none;border:0;color:var(--muted);padding:6px 0;cursor:pointer}
.nav button.on{color:var(--teal);font-weight:600}
.btn{font:inherit;border:1.5px solid var(--teal);color:var(--teal);background:var(--paper);border-radius:10px;padding:12px;text-align:center;font-weight:600;cursor:pointer;width:100%}
.btn.fill{background:var(--teal);color:#fff}
.btn.q{border-color:var(--line);color:var(--ink);font-weight:500;text-align:right}
.btn[disabled]{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted)}
.lab{font-size:12px;font-weight:600;color:var(--teal)}
.input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:var(--paper);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--paper);cursor:pointer}
.chip.on{border-color:var(--teal);color:var(--teal);font-weight:600;background:var(--soft)}
.brand{font-size:32px;color:var(--teal);text-align:center;margin-top:30px;font-weight:600}
video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#000}
.k{font-size:11px;font-weight:600;color:var(--gold)}
.obs{font-size:17px}.act{font-size:21px;font-weight:700;color:var(--teal);line-height:1.35}
.dose{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.strip div{border:1px solid var(--sand);border-radius:5px;padding:5px 2px;text-align:center;font-size:10px;color:var(--muted);min-height:48px}
.strip .n{font-weight:600;color:var(--teal);display:block;margin-bottom:3px}
.strip .o{background:var(--shade)}.strip .m{color:var(--pen);font-weight:600}
.shade{flex:1;background:var(--shade);border-radius:16px;min-height:300px}
.count{font-size:20px;color:var(--teal);font-weight:700;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid div{aspect-ratio:1;border:1px solid var(--sand);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--pen)}
.grid .o{background:var(--shade);border-color:var(--shade)}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row span:last-child{color:var(--muted)}
.res{font-size:12px;color:var(--teal);text-align:center;text-decoration:underline;margin-top:8px}
.err{color:#8A3B2E;font-size:13px}
textarea.input{resize:none;height:44px}
.skel{height:16px;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--shade),var(--soft));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--teal);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:600;padding:11px;border:0;background:var(--paper);color:var(--teal);cursor:pointer}
.seg button.on{background:var(--teal);color:#fff}
select.input{appearance:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
// A Wider Life · web client. Renders what the Worker returns; computes no rule of its own.
// API base: `?api=https://…workers.dev` once (saved), else what was saved, else this page's own origin.
// Inside the native shell (Capacitor) the page origin is capacitor://localhost, so the API base is the live Worker.
const NATIVE = Boolean(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const PLUGIN = (name) => (NATIVE && window.Capacitor.Plugins && window.Capacitor.Plugins[name]) || null;
const PROD_API = "https://a-wider-life.ahmed-haz.workers.dev";
const API = (() => {
  const q = new URLSearchParams(location.search).get("api");
  if (q) { try { localStorage.setItem("awl.api", q.replace(/\/$/, "")); } catch {} }
  let saved = null; try { saved = localStorage.getItem("awl.api"); } catch {}
  return saved || (NATIVE ? PROD_API : location.origin);
})();
const T = {
  ar: { recovery:"رمز الاسترجاع", recoveryHint:"دي نسختك. اكتبها في آخر صفحة من كتابك. لو غيّرت تليفونك أو مسحت التطبيق، الرمز ده بيرجّعك لنفس المكان.", show:"اظهر", copy:"انسخ", copied:"اتنسخ", copyFail:"انسخها بإيدك", restore:"استرجع نسخة بالرمز", restorePrompt:"اكتب رمز الاسترجاع", badCode:"الرمز مش معروف. اتأكد من الحروف.", language:"اللغة", rhythm:"الإيقاع", active:"شغّال", paused:"متوقف مؤقتاً", pauseHint:"وقّف لما تحتاج. العدّاد بيستنّاك، وما بيتصفّرش.", oneCircle:"الدواير التانية لسه بتتكتب.", doneHint:"خلصت اللي مكتوب لحد دلوقتي. الورق والدفتر باقيين معاك.", quotes:"أقوال ابن عربي", quotesHint:"قول كل ٣ ساعات، من ١٠ صباحاً حتى ٢ بعد منتصف الليل.", on:"مفعّل", off:"متوقف", nativeOnly:"في التطبيق فقط", noPerm:"لازم تسمح بالإشعارات من إعدادات النظام.", offline:"ما قدرناش نوصل للخدمة. جرب تاني.", retry:"جرب تاني", before:"قبل ما تبدأ", tz:"منطقتك الزمنية", tzHint:"جبناها من جهازك. لو صح اضغط تمام.", ok:"تمام", openDay:"يومك المفتوح اسمه إيه؟", openHint:"يوم في الأسبوع مفيهوش مطلوب. سمّيه مرة، وما تنقلوش كل أسبوع.", who:"هتقوله لمين؟", whoHint:"اسم واحد بس. التطبيق مش هيبعتله حاجة، ده ليك إنت.", next:"كمّل", circle:"هتبدأ من أنهي دايرة؟", start:"ابدأ", week:"الأسبوع", day:"اليوم", notebook:"الدفتر", settings:"الإعدادات", sheet:"صفحة الأسبوع", f1:"أنا فين دلوقتي", f2:"بشتغل على إيه", f3:"الحدث اللي هعلّق عليه", f3h:"حاجة بتحصل في يومي أصلاً، وأنا اللي بختاره", f4:"الفعل بتلات جرعات", f4h:"أقل حاجة نفس الفعل أصغر، مش فعل تاني أسهل", full:"الكاملة", half:"النص", min:"أقل حاجة", f5:"العلامة", f5h:"حاجة تلاحظها، مش حاجة تعدّها", f6:"الأسبوع", save:"احفظ الورقة", pin:"ثبّت فعل المقال في ورقتي", locked:"الورقة اتقفلت. الفعل ما بيتغيّرش في نص الأسبوع، الجرعة هي اللي بتتغيّر.", foot:"عدّاد مش سلسلة · ومفيش خانة للفشل", says:"حياة أوسع النهاردة بتقولك", obs:"الملاحظة", actL:"الفعل", sign:"العلامة", tapAfter:"اضغط بعد ما تعمله، مش قبل", done:"تم", smaller:"أصغر", doseL:"الجرعة", first:"أول يوم في الأسبوع: اقرا المقال واملا ورقتك.", openK:"مفتوح", questionK:"سؤال", beforeStart:"أسبوعك الأول بيبدأ يوم {d} ({on}). لحد ساعتها اقرا المقال واملا ورقتك على مهلك، ومفيش حاجة بتتعدّ.", question:"سؤال واحد. قف عنده دقيقة.", noRight:"مفيش إجابة صح. الإجابة بتتكتب زي ما هي.", incomplete:"الورقة لسه ناقصة: الدايرة والخصلة والحدث والفعل الكامل.", witness:"يومك المفتوح {d}، وقلت لـ{w}.", moved:"{p} يوم، اتحركت في {m}", pause:"إيقاف مؤقت", resume:"استئناف", startOver:"بداية جديدة", del:"حذف الحساب", resources:"موارد بلدك", circles:{self:"نفسي",home:"بيتي",work:"شغلي",people:"ناسي"}, doses:{full:"الكاملة",half:"النص",min:"أقل حاجة"}, sure:"متأكد؟ ده بيمسح كل حاجة على النسخة دي.", tomorrow:"نبضة بكرة، اسمعها الليلة واعملها الصبح" },
  en: { recovery:"Recovery code", recoveryHint:"This is your copy. Write it on the last page of your book. If you change phone or delete the app, this code brings you back to the same place.", show:"Show", copy:"Copy", copied:"Copied", copyFail:"Copy it by hand", restore:"Restore a copy with a code", restorePrompt:"Type the recovery code", badCode:"Unknown code. Check the letters.", language:"Language", rhythm:"Rhythm", active:"Running", paused:"Paused", pauseHint:"Pause when you need to. The counter waits, and never resets.", oneCircle:"The other circles are still being written.", doneHint:"You have reached the end of what is written. Your sheets and notebook stay with you.", quotes:"Ibn Arabi quotes", quotesHint:"One saying every three hours, from 10am to 2am.", on:"On", off:"Off", nativeOnly:"App only", noPerm:"Allow notifications in system settings.", offline:"We could not reach the service. Try again.", retry:"Try again", before:"Before you start", tz:"Your time zone", tzHint:"We took it from your device. If it is right, tap OK.", ok:"OK", openDay:"What is your open day called?", openHint:"One day a week with nothing required. Name it once, and do not move it every week.", who:"Who will you tell?", whoHint:"One name only. The app will never message them. This is for you.", next:"Continue", circle:"Which circle will you start from?", start:"Start", week:"Week", day:"Day", notebook:"Notebook", settings:"Settings", sheet:"THE WEEK SHEET", f1:"Where I am now", f2:"What I am working on", f3:"What it hangs on", f3h:"something that happens in my day anyway, and I choose it", f4:"The act, in three doses", f4h:"the smallest is the same act made smaller, not an easier one", full:"Full", half:"Half", min:"Smallest", f5:"The sign", f5h:"something you would notice, not something you count", f6:"The week", save:"Save the sheet", pin:"Pin the article's act to my sheet", locked:"The sheet is locked. The act does not change mid-week; the dose does.", foot:"A counter, not a chain. There is no box for failure.", says:"A Wider Life says today", obs:"Where you are", actL:"The act", sign:"The sign", tapAfter:"Tap after you do it, not before", done:"Done", smaller:"Smaller", doseL:"Dose", first:"First day of the week: read the article and fill your sheet.", openK:"open", questionK:"question", beforeStart:"Your first week starts on {d} ({on}). Until then, read the article and fill your sheet at your own pace. Nothing is counted yet.", question:"One question. Stay with it for a minute.", noRight:"There is no right answer. It is written down as it is.", incomplete:"The sheet is not complete yet: circle, trait, anchor and the full act.", witness:"Your open day is {d}, and you told {w}.", moved:"{p} days. You moved on {m}.", pause:"Pause", resume:"Resume", startOver:"Start over", del:"Delete account", resources:"Your country's resources", circles:{self:"Myself",home:"My home",work:"My work",people:"My people"}, doses:{full:"Full",half:"Half",min:"Smallest"}, sure:"Sure? This wipes everything on this copy.", tomorrow:"Tomorrow's pulse. Hear it tonight, do it in the morning" },
};
let FLAGS = null;
const S = { token: localStorage.getItem("awl.token"), lang: localStorage.getItem("awl.lang") || "ar", screen: "door", data: null, err: null };
const t = () => T[S.lang];
const app = document.getElementById("app");
const h = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { "content-type": "application/json", ...(S.token ? { authorization: "Bearer " + S.token } : {}), ...(opts.headers || {}) } });
  const text = await res.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch {}
  if (!res.ok) { const e = new Error((data && data.code) || res.status); e.status = res.status; e.data = data; throw e; }
  return data;
}

function setLang(l) { if (l !== S.lang) FLAGS = null; S.lang = l; localStorage.setItem("awl.lang", l); document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr"; }
setLang(S.lang);

function nav(active) {
  const x = t();
  return `<div class="nav">${[["week", x.week], ["day", x.day], ["notebook", x.notebook], ["settings", x.settings]].map(([k, l]) => `<button class="${active === k ? "on" : ""}" data-go="${k}">${l}</button>`).join("")}</div>`;
}
function topBar(title, sub = "") { return `<div class="top"><div class="t">${h(title)}</div><div class="w">${h(sub)}</div></div>`; }
// A real zone list beats free text: one typo used to be enough to break every date rule in the engine.
const ZONES = (() => {
  try { const all = Intl.supportedValuesOf("timeZone"); if (all && all.length) return all; } catch {}
  return ["Africa/Cairo", "Asia/Riyadh", "Asia/Dubai", "Europe/London", "America/New_York", "UTC"];
})();
function zoneOptions(sel) {
  const list = ZONES.includes(sel) ? ZONES : [sel, ...ZONES];
  return list.map((z) => `<option value="${h(z)}" ${z === sel ? "selected" : ""}>${h(z.replace(/_/g, " "))}</option>`).join("");
}
const fmtDate = (iso) => { try { return new Intl.DateTimeFormat(S.lang === "ar" ? "ar-EG" : "en-GB", { day: "numeric", month: "long" }).format(new Date(iso + "T00:00:00")); } catch { return iso; } };
const errLine = () => S.err ? `<div class="err">${h(S.err)}</div>` : "";
// Something on screen while a request is in flight. Drawn only when the app is otherwise empty, so
// moving between tabs keeps the current screen rather than flashing.
function busy(title) {
  if (app.innerHTML.trim() && !app.dataset.busy) return;
  app.dataset.busy = "1";
  app.innerHTML = topBar(title || "") + `<div class="body"><div class="skel"></div><div class="skel"></div><div class="skel" style="width:60%"></div></div>`;
}
const unbusy = () => { delete app.dataset.busy; };

// ---------- screens ----------
// No code and no door: the first open mints an anonymous session and goes straight in.
async function openAnon() {
  S.err = null;
  try {
    const r = await api("/v1/session/anon", { method: "POST", body: JSON.stringify({ lang: S.lang }) });
    S.token = r.token; localStorage.setItem("awl.token", r.token); setLang(r.lang);
    history.replaceState(null, "", "/");
    r.state === "entry" ? entry() : go("day");
  } catch (e) { S.err = String(e.message); unreachable(); }
}
// The only screen left that is not content: the Worker could not be reached to open a session.
function unreachable() {
  const x = t();
  app.innerHTML = `<div class="body"><div class="brand">${S.lang === "ar" ? "حياة أوسع" : "A Wider Life"}</div>
    <div class="hint">${x.offline}</div>
    ${errLine()}<button class="btn fill" id="retry">${x.retry}</button>
    <div class="hint" style="text-align:center;margin-top:auto"><button class="chip" data-lang="${S.lang === "ar" ? "en" : "ar"}">${S.lang === "ar" ? "English" : "عربي"}</button></div></div>`;
  document.getElementById("retry").onclick = openAnon;
  bind();
}

async function entry(step = 1, st = { tz: Intl.DateTimeFormat().resolvedOptions().timeZone, open: 5, names: null, witness: "", circle: null }) {
  const x = t();
  const f = await flags();
  const circles = (f.circles || []).length ? f.circles : ["self"];
  if (!st.circle || !circles.includes(st.circle)) st.circle = circles[0];
  unbusy();
  const DAYS = S.lang === "ar" ? ["الأحد", "الاتنين", "التلات", "الأربع", "الخميس", "الجمعة", "السبت"] : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  if (st.open === 5 && S.lang === "en") st.open = 0;
  let inner = "";
  if (step === 1) inner = `<div class="lab">${x.tz}</div><div class="hint">${x.tzHint}</div><select class="input" id="tz">${zoneOptions(st.tz)}</select><div style="margin-top:auto"></div><button class="btn fill" id="n">${x.ok}</button>`;
  if (step === 2) inner = `<div class="lab">${x.openDay}</div><div class="hint">${x.openHint}</div><div class="chips">${DAYS.map((d, i) => `<button class="chip ${i === st.open ? "on" : ""}" data-d="${i}">${d}</button>`).join("")}</div>
    <div class="lab" style="margin-top:10px">${x.who}</div><div class="hint">${x.whoHint}</div><input class="input" id="wit" value="${h(st.witness)}"><div style="margin-top:auto"></div><button class="btn fill" id="n">${x.next}</button>`;
  if (step === 3) inner = `<div class="lab">${x.circle}</div><div class="chips">${circles.map((k) => `<button class="chip ${k === st.circle ? "on" : ""}" data-c="${k}">${x.circles[k]}</button>`).join("")}</div>${circles.length === 1 ? `<div class="hint">${x.oneCircle}</div>` : ""}${errLine()}<div style="margin-top:auto"></div><button class="btn fill" id="n">${x.start}</button>`;
  app.innerHTML = topBar(x.before, `\u200e${step} / 3`) + `<div class="body">${inner}</div>`;
  app.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => { st.open = +b.dataset.d; entry(2, st); });
  app.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => { st.circle = b.dataset.c; entry(3, st); });
  document.getElementById("n").onclick = async () => {
    if (step === 1) { st.tz = document.getElementById("tz").value.trim(); return entry(2, st); }
    if (step === 2) { st.witness = document.getElementById("wit").value.trim(); return entry(3, st); }
    // the reader's week: the first day is the day after the open day; names in that order
    const first = (st.open + 1) % 7; st.names = Array.from({ length: 7 }, (_, i) => DAYS[(first + i) % 7]);
    try { await api("/v1/entry", { method: "POST", body: JSON.stringify({ timezone: st.tz, open_day: st.open, day_names: st.names, witness_name: st.witness, circle: st.circle }) }); go("week"); }
    catch (e) { S.err = e.status === 451 ? (S.lang === "ar" ? "بلدك لسه ما اتفتحش." : "Your country is not open yet.") : String(e.message); entry(3, st); }
  };
}

function stripHtml(strip) { return `<div class="strip">${strip.map((d) => `<div class="${d.kind === "open" ? "o" : ""}"><span class="n">${h(d.name)}</span>${d.kind === "act" ? `<span class="${d.answer ? "m" : ""}">${d.answer === "done" ? t().done : d.answer === "smaller" ? t().smaller : ""}</span>` : d.kind === "open" ? t().openK : t().questionK}</div>`).join("")}</div>`; }
const pulseHtml = (p, x) => `<div class="k">${x.obs}</div><div class="obs">${h(p.observation)}</div>${p.audio.observation ? `<audio controls src="${h(p.audio.observation)}"></audio>` : ""}
  <div class="k">${x.actL}</div><span class="dose">${x.doseL}: ${x.doses[p.dose]}</span><div class="act">${h(p.act)}</div>${p.audio.act ? `<audio controls src="${h(p.audio.act)}"></audio>` : ""}
  <div class="k">${x.sign}</div><div>${h(p.sign)}</div>`;

async function day() {
  const x = t(); busy(x.day); let d;
  try { d = await api("/v1/today"); } catch (e) { if (e.status === 409 && e.message === "entry_incomplete") return entry(); if (e.status === 401) { localStorage.removeItem("awl.token"); S.token = null; return openAnon(); } S.err = String(e.message); }
  unbusy(); if (!d) { app.innerHTML = topBar(x.day) + `<div class="body">${errLine()}</div>` + nav("day"); return bind(); }
  let inner = "";
  if (d.kind === "done") inner = `<div class="brand" style="margin-top:0">${S.lang === "ar" ? "حياة أوسع" : "A Wider Life"}</div><div class="hint" style="text-align:center">${x.doneHint}</div><button class="btn" data-go="notebook">${x.notebook}</button>`;
  else if (d.kind === "open") inner = `<div class="shade"></div>`;
  else if (d.kind === "question") inner = `<div class="hint">${x.question}</div><div class="act">${h(d.question?.text || "")}</div>${(d.question?.options || []).map((o, i) => `<button class="btn q" data-q="${i}" ${d.answered ? "disabled" : ""}>${h(o)}</button>`).join("")}<div class="hint">${x.noRight}</div>`;
  else if (d.kind === "before") inner = `<div class="hint">${x.beforeStart.replace("{d}", h(d.strip[0]?.name || "")).replace("{on}", h(fmtDate(d.starts_on || "")))}</div>${d.witness ? `<div class="hint">${x.witness.replace("{d}", h(d.witness.open_day)).replace("{w}", h(d.witness.witness))}</div>` : ""}${d.first ? `<div class="act">${h(d.first.title)}</div><div class="k">${x.f4}</div><div>${h(d.first.act_full)} · ${h(d.first.act_half)} · ${h(d.first.act_min)}</div>` : ""}<button class="btn" data-go="week">${x.sheet}</button>`;
  else if (d.kind === "first") inner = `<div class="hint">${x.first}</div>${d.witness ? `<div class="hint">${x.witness.replace("{d}", h(d.witness.open_day)).replace("{w}", h(d.witness.witness))}</div>` : ""}${d.first ? `<div class="act">${h(d.first.title)}</div><div class="k">${x.f4}</div><div>${h(d.first.act_full)} · ${h(d.first.act_half)} · ${h(d.first.act_min)}</div>` : ""}<button class="btn" data-go="week">${x.sheet}</button>${d.next?.pulse ? `<div class="hint" style="margin-top:14px">${x.tomorrow}</div>${pulseHtml(d.next.pulse, x)}` : ""}`;
  else inner = `<div class="hint">${x.says}</div>${d.pulse ? pulseHtml(d.pulse, x) : `<div class="hint">${x.incomplete}</div>`}
    ${d.answerable && d.pulse ? `<div class="hint" style="text-align:center;margin-top:auto">${x.tapAfter}</div><div class="two"><button class="btn fill" data-a="done">${x.done}</button><button class="btn" data-a="smaller">${x.smaller}</button></div>` : ""}
    ${d.next?.pulse ? `<div class="hint" style="margin-top:14px">${x.tomorrow}</div>${pulseHtml(d.next.pulse, x)}` : ""}`;
  app.innerHTML = topBar(d.strip[d.day - 1]?.name || x.day, `${x.week} ${d.week_no}`) + `<div class="body">${inner}${errLine()}${stripHtml(d.strip)}${d.resources ? `<div class="res">${x.resources}: ${h(d.resources.name)} ${h(d.resources.number)}</div>` : ""}</div>` + nav("day");
  app.querySelectorAll("[data-a]").forEach((b) => b.onclick = async () => { try { const r = await api("/v1/answer", { method: "POST", body: JSON.stringify({ answer: b.dataset.a }) }); if (r.smaller) { S.err = null; } day(); } catch (e) { S.err = String(e.message); day(); } });
  app.querySelectorAll("[data-q]").forEach((b) => b.onclick = async () => { try { await api("/v1/question", { method: "POST", body: JSON.stringify({ option: +b.dataset.q }) }); day(); } catch (e) { S.err = String(e.message); day(); } });
  bind();
}

async function week() {
  const x = t(); busy(x.sheet);
  const cf = await flags();
  const circles = (cf.circles || []).length ? cf.circles : ["self"];
  let w;
  try { w = await api("/v1/week"); } catch (e) { if (e.status === 409) return entry(); if (e.status === 401) { localStorage.removeItem("awl.token"); S.token = null; return openAnon(); } S.err = String(e.message); }
  unbusy(); if (!w) { app.innerHTML = topBar(x.sheet) + `<div class="body">${errLine()}</div>` + nav("week"); return bind(); }
  const ro = w.locked ? "disabled" : "";
  const f = (k, v, hint) => `<div class="lab">${k}</div>${hint ? `<div class="hint">${hint}</div>` : ""}<input class="input" data-f="${v}" value="${h(w[v] || "")}" ${ro} maxlength="140">`;
  app.innerHTML = topBar(x.sheet, `${x.week} ${w.week_no}`) + `<div class="body">
    ${w.article ? `<div class="act">${h(w.article.title)}</div><details><summary class="hint">${S.lang === "ar" ? "المقال" : "The article"}</summary><div>${h(w.article.body_md)}</div></details>` : ""}
    <div class="lab">${x.f1}</div><div class="chips">${circles.map((k) => `<button class="chip ${k === w.circle ? "on" : ""}" data-circle="${k}" ${ro}>${x.circles[k]}</button>`).join("")}</div>
    <div class="lab">${x.f2}</div><div>${h(w.trait_label || w.trait_id || "")}</div>
    ${f(x.f3, "anchor_text", x.f3h)}
    <div class="lab">${x.f4}</div><div class="hint">${x.f4h}</div>
    ${f(x.full, "act_full")}${f(x.half, "act_half")}${f(x.min, "act_min")}
    ${f(x.f5, "sign_text", x.f5h)}
    ${w.locked ? `<div class="hint">${x.locked}</div>` : `<button class="btn" id="pin">${x.pin}</button><button class="btn fill" id="save">${x.save}</button>`}
    ${errLine()}<div class="hint" style="text-align:center">${x.foot}</div></div>` + nav("week");
  if (!w.locked) {
    document.getElementById("save").onclick = async () => { const body = {}; app.querySelectorAll("[data-f]").forEach((i) => body[i.dataset.f] = i.value); try { await api("/v1/week", { method: "PUT", body: JSON.stringify(body) }); S.err = null; week(); } catch (e) { S.err = String(e.message); week(); } };
    document.getElementById("pin").onclick = async () => { try { await api("/v1/week/pin", { method: "POST" }); week(); } catch (e) { S.err = String(e.message); week(); } };
    app.querySelectorAll("[data-circle]").forEach((b) => b.onclick = async () => { try { await api("/v1/week", { method: "PUT", body: JSON.stringify({ circle: b.dataset.circle }) }); week(); } catch (e) { S.err = String(e.message); week(); } });
  }
  bind();
}

async function notebook() {
  const x = t(); busy(x.notebook); let n;
  try { n = await api("/v1/notebook"); } catch (e) { if (e.status === 401) { localStorage.removeItem("awl.token"); S.token = null; return openAnon(); } if (e.status === 409) return entry(); S.err = String(e.message); }
  unbusy(); if (!n) { app.innerHTML = topBar(x.notebook) + `<div class="body">${errLine()}</div>` + nav("notebook"); return bind(); }
  const grid = n.grid.map((e) => `<div class="${e.answer === "empty" ? "" : ""}">${e.answer === "done" ? "●" : e.answer === "smaller" ? "◐" : e.answer === "question" ? "?" : ""}</div>`).join("");
  app.innerHTML = topBar(x.notebook) + `<div class="body"><div class="count">${x.moved.replace("{p}", n.count.passed).replace("{m}", n.count.moved)}</div><div class="grid">${grid}</div>
    ${n.weeks.map((w) => `<div class="row"><span>${x.week} ${w.week_no} · ${x.circles[w.circle] || w.circle} · ${h(w.trait_label || w.trait_id || "")}</span><span>${w.week_no === n.current_week ? (S.lang === "ar" ? "الأسبوع ده" : "This week") : "›"}</span></div>`).join("")}
    ${n.resources ? `<div class="res">${x.resources}: ${h(n.resources.name)} ${h(n.resources.number)}</div>` : ""}</div>` + nav("notebook");
  bind();
}

async function settings() {
  const x = t(); busy(t().settings);
  let st = null; try { st = (await api("/v1/today")).status; } catch {}
  const f = await flags(); const langs = (f.langs || []).length ? f.langs : [S.lang];
  unbusy();
  app.innerHTML = topBar(x.settings) + `<div class="body">
    ${langs.length > 1 ? `<div class="row"><span>${x.language}</span><button class="chip" data-lang="${S.lang === "ar" ? "en" : "ar"}">${S.lang === "ar" ? "English" : "عربي"}</button></div>` : ""}
    <div class="row"><span>${x.quotes}</span><button class="chip" id="qt">${notifOn() ? x.on : x.off}</button></div>
    <div class="hint">${x.quotesHint}</div>
    <div class="lab">${x.recovery}</div>
    <div class="hint">${x.recoveryHint}</div>
    <div class="row"><span id="rc" style="direction:ltr;letter-spacing:.08em;font-weight:600">••••• ••••• •••••</span><button class="chip" id="rcShow">${x.show}</button></div>
    <button class="btn" id="restore">${x.restore}</button>
    <div class="lab" style="margin-top:14px">${x.rhythm}</div>
    <div class="seg"><button id="resume" class="${st === "active" ? "on" : ""}">${x.active}</button><button id="pause" class="${st === "paused" ? "on" : ""}">${x.paused}</button></div>
    <div class="hint">${x.pauseHint}</div>
    <div style="margin-top:auto"></div>
    <button class="btn" id="so">${x.startOver}</button><button class="btn" id="del">${x.del}</button>${errLine()}</div>` + nav("settings");
  const act = (action) => async () => { if ((action === "start_over" || action === "delete") && !confirm(x.sure)) return; try { await api("/v1/account", { method: "POST", body: JSON.stringify({ action }) }); if (action === "start_over" || action === "delete") { localStorage.removeItem("awl.token"); S.token = null; return openAnon(); } settings(); } catch (e) { S.err = String(e.message); settings(); } };
  const qt = document.getElementById("qt");
  if (!PLUGIN("LocalNotifications")) { qt.disabled = true; qt.textContent = x.nativeOnly; }
  else qt.onclick = async () => { const on = await setQuotes(!notifOn()); qt.textContent = on ? x.on : x.off; if (!on && notifOn()) S.err = x.noPerm; };
  const rcShow = document.getElementById("rcShow");
  rcShow.onclick = async () => {
    try {
      const r = await api("/v1/account", { method: "POST", body: JSON.stringify({ action: "recovery_code" }) });
      document.getElementById("rc").textContent = r.printed;
      rcShow.textContent = x.copy;
      rcShow.onclick = async () => { try { await navigator.clipboard.writeText(r.code); rcShow.textContent = x.copied; } catch { rcShow.textContent = x.copyFail; } };
    } catch (e) { S.err = String(e.message); settings(); }
  };
  document.getElementById("restore").onclick = async () => {
    const code = prompt(x.restorePrompt);
    if (!code) return;
    try {
      const r = await api("/v1/session/open", { method: "POST", body: JSON.stringify({ code }) });
      S.token = r.token; localStorage.setItem("awl.token", r.token); setLang(r.lang);
      r.state === "entry" ? entry() : go("day");
    } catch (e) { S.err = e.status === 404 ? x.badCode : String(e.message); settings(); }
  };
  document.getElementById("pause").onclick = act("pause"); document.getElementById("resume").onclick = act("resume");
  document.getElementById("so").onclick = act("start_over"); document.getElementById("del").onclick = act("delete");
  bind();
}

function bind() {
  app.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => go(b.dataset.go));
  app.querySelectorAll("[data-lang]").forEach((b) => b.onclick = () => { setLang(b.dataset.lang); if (!S.token) return unreachable(); go(["day", "week", "notebook", "settings"].includes(S.screen) ? S.screen : "day"); });
}
function go(s) { S.err = null; S.screen = s; ({ day, week, notebook, settings })[s](); }
S.token ? go("day") : openAnon();
if (!NATIVE && "serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});


// ---------- Ibn Arabi quotes, as local notifications ----------
// Local, not push: nothing is scheduled by a server, so this works offline and needs no APNs key.
// iOS caps an app at 64 PENDING notifications. 10:00 to 02:00 every three hours is 6 a day, so
// filling to NOTIF_MAX covers about ten days; the queue is refilled on every open anyway.
const NOTIF_START_H = 10, NOTIF_END_H = 2, NOTIF_STEP_MIN = 180, NOTIF_MAX = 60;
// Window length in minutes, wrapping past midnight: 10:00 -> 02:00 is 16 hours.
const NOTIF_WINDOW_MIN = ((NOTIF_END_H - NOTIF_START_H + 24) % 24) * 60;
const notifOn = () => { try { return localStorage.getItem("awl.quotes") === "1"; } catch { return false; } };

/** The next `count` slots, anchored to the window start so the times never drift with when we refill. */
function nextSlots(from, count) {
  const out = [];
  const base = new Date(from); base.setHours(NOTIF_START_H, 0, 0, 0);
  for (let day = 0; out.length < count && day < 400; day++) {
    for (let off = 0; off <= NOTIF_WINDOW_MIN && out.length < count; off += NOTIF_STEP_MIN) {
      const at = new Date(base); at.setDate(at.getDate() + day); at.setMinutes(at.getMinutes() + off);
      if (at > from) out.push(at);
    }
  }
  return out;
}

// What the server can actually serve: circles with articles, languages with content.
async function flags() {
  if (FLAGS) return FLAGS;
  try { FLAGS = await api(`/v1/flags?lang=${S.lang}`); } catch { FLAGS = { circles: [], langs: [] }; }
  return FLAGS;
}

let QUOTES = null;
async function loadQuotes() {
  if (QUOTES) return QUOTES;
  // Bundled in the app and served by the Worker, so it resolves both natively and on the web.
  const r = await fetch(NATIVE ? "quotes.json" : "/quotes.json");
  QUOTES = (await r.json()).quotes;
  return QUOTES;
}

/** Clear whatever is queued and refill from now. Safe to call on every open; it is idempotent. */
async function scheduleQuotes() {
  const ln = PLUGIN("LocalNotifications");
  if (!ln || !notifOn()) return;
  try {
    const pending = await ln.getPending();
    if (pending.notifications.length) await ln.cancel({ notifications: pending.notifications.map((n) => ({ id: n.id })) });
    const qs = await loadQuotes();
    // Walk the quotes in order from a rotating offset, so a refill does not always restart at قول 1.
    let off = 0; try { off = Number(localStorage.getItem("awl.quotesAt") || 0) % qs.length; } catch {}
    const slots = nextSlots(new Date(), NOTIF_MAX);
    await ln.schedule({ notifications: slots.map((at, i) => {
      const q = qs[(off + i) % qs.length];
      return { id: 1000 + i, title: S.lang === "ar" ? "حياة أوسع" : "A Wider Life", body: q.text, schedule: { at }, smallIcon: "ic_stat_icon_config_sample" };
    }) });
    try { localStorage.setItem("awl.quotesAt", String((off + slots.length) % qs.length)); } catch {}
  } catch {}
}

async function setQuotes(on) {
  const ln = PLUGIN("LocalNotifications");
  if (!ln) return false;
  if (!on) {
    try { localStorage.setItem("awl.quotes", "0"); } catch {}
    try { const p = await ln.getPending(); if (p.notifications.length) await ln.cancel({ notifications: p.notifications.map((n) => ({ id: n.id })) }); } catch {}
    return false;
  }
  let perm = await ln.checkPermissions();
  if (perm.display !== "granted") perm = await ln.requestPermissions();
  if (perm.display !== "granted") return false;
  try { localStorage.setItem("awl.quotes", "1"); } catch {}
  await scheduleQuotes();
  return true;
}

const AppPlugin = PLUGIN("App");

// Push registration is built but dormant: it runs only when the Worker's flag says so (decision due 24 Oct).
async function registerPush() {
  const push = PLUGIN("PushNotifications"); if (!push || !S.token) return;
  try {
    const f = await api("/v1/flags"); if (!f.notify) return;
    const perm = await push.requestPermissions(); if (perm.receive !== "granted") return;
    push.addListener("registration", (t) => api("/v1/device", { method: "POST", body: JSON.stringify({ platform: "ios", token: t.value }) }).catch(() => {}));
    await push.register();
  } catch {}
}
registerPush();
scheduleQuotes();
if (AppPlugin) AppPlugin.addListener("appStateChange", ({ isActive }) => { if (isActive) scheduleQuotes(); });
