name = "a-wider-life"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = []

[assets]
directory = "../web"      # the client shell: index.html, manifest, service worker
binding = "ASSETS"

[triggers]
crons = ["0 * * * *"]   # the day-close job, hourly, acting on readers whose local midnight just passed

[vars]
BUILD = "dev"
ADMIN_ENABLED = "true"
NOTIFY_ENABLED = "false"          # push registration stays dormant until the 24 Oct decision
APPLE_TEAM_ID = "M3RPNM736H"      # Ahmed's personal Apple Developer team (public in every signed build anyway)
IOS_BUNDLE_ID = "com.awiderlife.app"

# Secrets, set with `wrangler secret put` or the ship script, never here:
# SUPABASE_URL · SUPABASE_SERVICE_KEY · ADMIN_SECRET
